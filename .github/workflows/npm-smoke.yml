name: Verify published npm package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to verify (empty uses the workflow ref)
        type: string
        default: ''
      allow_initial_latest:
        description: Accept the registry latest tag on the first npm publication only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify registry installation
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ALLOW_INITIAL_LATEST: ${{ inputs.allow_initial_latest }}
        run: |
          args=()
          if [ "$ALLOW_INITIAL_LATEST" = true ]; then
            args+=(--allow-initial-latest)
          fi
          python scripts/smoke-install.py --mode registry --tag "$RELEASE_TAG" "${args[@]}"
