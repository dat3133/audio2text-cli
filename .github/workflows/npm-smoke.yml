name: Verify published npm package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/check-release.py --tag "${{ github.ref_name }}"
      - run: python scripts/smoke-install.py --mode registry
