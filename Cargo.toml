[package]
name = "audio2text"
version = "0.1.0-beta.5"
edition = "2024"
description = "Local speech-to-text CLI with guided setup and agent-friendly JSON"
license = "Apache-2.0"
repository = "https://github.com/dat3133/audio2text-cli"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
dialoguer = "0.11"
console = "0.15"
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
sha2 = "0.10"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[profile.release]
lto = "thin"
strip = true
